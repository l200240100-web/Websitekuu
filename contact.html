<body>
    <header class="header">
        <nav class="nav" role="navigation" aria-label="Navigasi utama">

        </nav>

    <main>
        <section class="contact-hero">
            <div class="container">
                <h1 class="section-title">Mari Berkolaborasi</h1>
                <p class="section-subtitle">Punya proyek menarik? Mari kita wujudkan bersama!</p>
            </div>
        </section>

        <section class="contact">
            <div class="container">
                <div class="contact-content">
                    <div class="contact-info">
                        <h2>Informasi Kontak</h2>
                        <div class="contact-item">
                            <i class="fas fa-envelope"></i>
                            <div>
                                <h3>Email</h3>
                                <p>l200240100@student.ums.ac.id</p>
                            </div>
                        </div>
                        <div class="contact-item">
                            <i class="fas fa-phone"></i>
                            <div>
                                <h3>Telepon</h3>
                                <p>+62 896-7028-7700</p>
                            </div>
                        </div>
                        <div class="contact-item">
                            <i class="fas fa-map-marker-alt"></i>
                            <div>
                                <h3>Lokasi</h3>
                                <p>Solo, Indonesia</p>
                            </div>
                        </div>
                        <div class="social-links">

                        <!-- LinkedIn -->
                             <a href="https://linkedin.com/in/qonitaazizah" target="_blank" aria-label="LinkedIn">
                                <i class="fab fa-linkedin-in"></i>
                             </a>

                         <!-- GitHub -->
                            <a href="https://github.com/qonitaazizah" target="_blank" aria-label="GitHub">
                                 <i class="fab fa-github"></i>
                             </a>

                        <!-- Instagram -->
                             <a href="https://www.instagram.com/invites/contact/?utm_source=ig_contact_invite&utm_medium=copy_link&utm_content=mpvl9ub" target="_blank" aria-label="Instagram">
                                 <i class="fab fa-instagram"></i>
                             </a>

                            <a href="https://twitter.com/qonitaazizah" target="_blank" aria-label="Twitter">
                                 <i class="fab fa-twitter"></i>
                             </a>
                        </div>
                    </div>

                    <form class="contact-form" aria-label="Formulir kontak">
                        <div class="form-group">
                            <label for="name">Nama Lengkap *</label>
                            <input type="text" id="name" name="name" required aria-required="true">
                        </div>
                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" name="email" required aria-required="true">
                        </div>
                        <div class="form-group">
                            <label for="subject">Subjek *</label>
                            <input type="text" id="subject" name="subject" required aria-required="true">
                        </div>
                        <div class="form-group">
                            <label for="message">Pesan *</label>
                            <textarea id="message" name="message" rows="6" required aria-required="true"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane"></i> Kirim Pesan
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; 2026 Qonita Azizah. Dibuat dengan <i class="fas fa-heart"></i> hati yang gembira.</p>
            </div>
        </div>
    </footer>

    <script>
        // Mobile menu toggle
        const menuToggle = document.querySelector('.menu-toggle');
        const navMenu = document.querySelector('.nav-menu');
        
        menuToggle.addEventListener('click', () => {
            const expanded = menuToggle.getAttribute('aria-expanded') === 'true';
            menuToggle.setAttribute('aria-expanded', !expanded);
            navMenu.classList.toggle('active');
        });

        // Form submission (simulasi)
        document.querySelector('.contact-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Terima kasih! Pesan Anda telah dikirim. (Ini simulasi - form belum fungsional)');
        });
    </script>
</body>
